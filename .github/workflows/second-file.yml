name: macOS Tahoe Demo

on:
  push:
  workflow_dispatch:

jobs:
  macos-job:
    runs-on: macos-latest

    steps:
      - name: Show macOS version
        run: |
          sw_vers
          uname -a

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Run custom commands
        run: |
          echo "Hello from macOS runner"
          pwd
          ls -la

      - name: Install Homebrew package
        run: |
          brew install wget

      - name: Test installed package
        run: |
          wget --version