name: seventh file

on:
      push:
            branches:
                  - main

permissions:
      contents: read

jobs:
      staging:
            runs-on: ubuntu-24.04
            environment: Staging
            steps:
                  - name: First step
                    uses: actions/checkout@v4

                  - name: setup-node
                    uses: actions/setup-node@v4
                    with:
                        node-version: '22'
      production: 
            runs-on: ubuntu-24.04
            needs: staging
            environment: Production
            steps:
                  - name: Deployment
                    uses: actions/checkout@v4

                  - run: echo "Node-Version Deployment successful"